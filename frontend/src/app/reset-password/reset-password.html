<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <h2>System Recovery</h2>
      <p>Enter your email to receive a 6-digit access code</p>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="input-group">
        <label>Registered Email</label>
        <div class="email-row">
          <input type="email" [(ngModel)]="resetData.email" name="email" 
                 placeholder="username@email.com" required>
          <button type="button" class="obtain-btn" (click)="onObtainCode()" [disabled]="isSending">
            {{ isSending ? 'SENDING...' : 'OBTAIN' }}
          </button>
        </div>
      </div>

      <div class="input-group">
        <label>Security Code</label>
        <input type="text" [(ngModel)]="resetData.token" name="token" 
               placeholder="000000" maxlength="6" class="code-input" required>
        <span class="helper-text">Check your inbox for the 6-digit key</span>
      </div>

      <div class="input-group">
        <label>New Passkey</label>
        <input type="password" [(ngModel)]="resetData.newPassword" name="newPassword" 
               placeholder="MIN 8 CHARACTERS" required>
      </div>

      <button type="submit" class="reset-btn" [disabled]="!resetData.token || !resetData.newPassword">
        Update Credentials
      </button>
      
      <div class="auth-footer">
        <a routerLink="/login">Return to Login Terminal</a>
      </div>
    </form>
  </div>
</div>
